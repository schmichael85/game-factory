<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עולם הקוביות – גאומטריה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Rubik','Segoe UI',Arial,sans-serif;background:linear-gradient(#73c2f2,#bfe6ff 55%,#dff3ff);min-height:100vh;color:#222;padding-bottom:64px;-webkit-user-select:none;user-select:none}
#ground{position:fixed;bottom:0;left:0;right:0;height:44px;z-index:0;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 22px,transparent 22px 44px),linear-gradient(#5fae3a 0 12px,#3f8a26 12px 15px,#8a5a32 15px);}
.cloud{position:fixed;background:#fff;opacity:.85;z-index:0;box-shadow:24px 0 0 #fff,48px 0 0 #fff,24px -18px 0 #fff}
.cloud{width:24px;height:18px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#3b2a1a;border-bottom:4px solid #1d140c;color:#fff}
header .title{font-weight:800;font-size:20px;flex:1;text-shadow:2px 2px 0 #000}
.hud{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px}
.hud span{background:#00000055;padding:4px 10px;border:2px solid #000}
main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:14px}
.scr{display:none}.scr.on{display:block;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.panel{background:#c6c6c6;border:4px solid #373737;box-shadow:inset -5px -5px 0 #8b8b8b,inset 5px 5px 0 #fff;padding:16px;margin-bottom:14px}
.panel.dark{background:#6f6f6f;color:#fff;box-shadow:inset -5px -5px 0 #4a4a4a,inset 5px 5px 0 #959595}
h1,h2,h3{margin:0 0 10px}
h1{font-size:30px;text-shadow:3px 3px 0 #fff}
h2{font-size:24px}
.btn{font:inherit;font-weight:800;font-size:18px;cursor:pointer;color:#fff;background:#5ea83a;border:3px solid #1f3d12;box-shadow:inset -4px -4px 0 #3d7a22,inset 4px 4px 0 #8fd765;padding:10px 18px;text-shadow:2px 2px 0 #1f3d12}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px)}
.btn.stone{background:#8f8f8f;border-color:#2b2b2b;box-shadow:inset -4px -4px 0 #5d5d5d,inset 4px 4px 0 #bdbdbd;text-shadow:2px 2px 0 #333}
.btn.wood{background:#a87a4c;border-color:#3d2814;box-shadow:inset -4px -4px 0 #7a5530,inset 4px 4px 0 #cfa171;text-shadow:2px 2px 0 #3d2814}
.btn.red{background:#c9473a;border-color:#4a120c;box-shadow:inset -4px -4px 0 #932f25,inset 4px 4px 0 #ec7c70;text-shadow:2px 2px 0 #4a120c}
.btn.gold{background:#e3b22b;border-color:#5a4108;box-shadow:inset -4px -4px 0 #b38510,inset 4px 4px 0 #ffd969;text-shadow:2px 2px 0 #5a4108}
.btn:disabled{opacity:.45;cursor:default;filter:grayscale(.6)}
.mini{font:inherit;font-size:18px;background:#8f8f8f;border:2px solid #000;box-shadow:inset -3px -3px 0 #5d5d5d,inset 3px 3px 0 #bdbdbd;cursor:pointer;padding:3px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{cursor:pointer;text-align:center;padding:18px 12px}
.tile:hover{filter:brightness(1.06);transform:translateY(-2px)}
.tile .ic{font-size:52px;line-height:1.1}
.tile .nm{font-size:22px;font-weight:800;margin:6px 0}
.tile .ds{font-size:15px;color:#333}
.tile .st{margin-top:6px;font-weight:700;color:#5a3d00}
.worlds{display:grid;gap:14px}
.lvls{display:flex;gap:10px;flex-wrap:wrap}
.lv{width:76px;height:84px;font:inherit;font-weight:800;font-size:24px;cursor:pointer;color:#fff;border:3px solid #222;background:#8a5a32;box-shadow:inset -4px -4px 0 #5e3c1f,inset 4px 4px 0 #b37d4c;text-shadow:2px 2px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.lv.world-angles{background:#7d7d7d;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #aaa}
.lv.world-shapes{background:#4f9a3a;box-shadow:inset -4px -4px 0 #2f6b20,inset 4px 4px 0 #7fcf63}
.lv .s{font-size:12px;letter-spacing:-1px}
.lv:disabled{background:#444;box-shadow:none;cursor:default;opacity:.7}
.qtext{font-size:22px;font-weight:600;line-height:1.5}
.fig{width:100%;max-width:440px;display:block;margin:10px auto;background:#fffdf3;border:3px solid #373737}
.fig .shp{fill:#a6dc84;stroke:#1f3d12;stroke-width:3;stroke-linejoin:round}
.fig .ray{stroke:#2b1d0e;stroke-width:4;stroke-linecap:round}
.fig .arc{fill:none;stroke:#e94f37;stroke-width:3}
.fig .arc2{fill:none;stroke:#2a7bd6;stroke-width:3}
.fig .lbl{font:800 18px Rubik,'Segoe UI',Arial;fill:#1b1b1b;text-anchor:middle}
.fig .lbl.q{fill:#d62d20;font-size:24px}
.fig .dash{stroke:#d62d20;stroke-width:2.5;stroke-dasharray:6 5}
.fig .grid{stroke:#c9c2a6;stroke-width:1}
.fig .cell{fill:#6ab04c;stroke:#2f5d1e;stroke-width:2}
.fig .tick{stroke:#1f3d12;stroke-width:3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{font:inherit;font-size:20px;font-weight:700;padding:14px 8px;background:#f2f2f2;border:3px solid #373737;box-shadow:inset -4px -4px 0 #a9a9a9,inset 4px 4px 0 #fff;cursor:pointer;color:#222}
.opt:hover:not(:disabled){background:#fff9d6}
.opt:disabled{cursor:default}
.opt.right{background:#7fd45a!important}
.opt.wrong{background:#f07a6a!important}
.fb{margin-top:12px;font-size:18px;line-height:1.6;min-height:10px}
.fb .good{color:#1d7a12;font-weight:800;font-size:22px}
.fb .bad{background:#fff3d6;border:3px solid #8a5a32;padding:10px 12px}
.blocks{display:flex;gap:6px}
.blk{width:34px;height:34px;border:3px solid #222;background:#8d8d8d;box-shadow:inset -3px -3px 0 #666,inset 3px 3px 0 #b5b5b5;display:flex;align-items:center;justify-content:center;font-size:18px}
.blk.ore{background:#3ab9c4;box-shadow:inset -3px -3px 0 #23838b,inset 3px 3px 0 #8fe6ee}
.blk.crk{background:#5a4a3a;box-shadow:none}
.blk.cur{outline:3px dashed #e3b22b}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.timer{height:18px;border:3px solid #222;background:#444;flex:1;min-width:140px}
.timer i{display:block;height:100%;background:#e3b22b;transition:width .25s linear}
.big{font-size:26px;font-weight:800}
#modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#modal.hidden{display:none}
#modal .panel{max-width:520px;width:100%;text-align:center;animation:pop .25s}
.stars{font-size:46px;letter-spacing:6px;margin:8px 0}
.stars .off{filter:grayscale(1) brightness(.6);opacity:.5}
.board{width:100%;max-width:600px;display:block;margin:10px auto;touch-action:none;background:#e9dfc0;border:4px solid #373737;cursor:crosshair}
.mis{display:flex;gap:6px;flex-wrap:wrap}
.mis .lv{width:48px;height:54px;font-size:18px}
.cv{width:100%;display:block;border:4px solid #373737;background:#9fd8ff}
input.num{font:inherit;font-size:24px;font-weight:800;width:100px;text-align:center;padding:6px;border:3px solid #222}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t td,table.t th{border:2px solid #555;padding:6px 8px;text-align:right}
table.t th{background:#e2e2e2}
.bar{min-width:0;height:16px;background:#5ea83a;border:2px solid #1f3d12;display:inline-block;vertical-align:middle}
.muted{color:#555;font-size:15px}
.tag{display:inline-block;background:#fff3d6;border:2px solid #8a5a32;padding:2px 8px;margin:2px;font-size:15px}
@media(max-width:640px){.tiles{grid-template-columns:1fr}.qtext{font-size:19px}.opt{font-size:17px}h1{font-size:24px}header .title{font-size:16px}}
</style>
</head>
<body>
<div class="cloud" style="top:90px;right:8%"></div>
<div class="cloud" style="top:170px;left:12%"></div>
<div class="cloud" style="top:320px;right:30%"></div>
<header>
  <button class="mini" id="homeBtn" title="בית">🏠</button><button class="mini" id="whoBtn" title="החלפת שחקן">👤</button>
  <div class="title" id="gameTitle">עולם הקוביות</div>
  <div class="hud"><span id="hudStars">⭐ 0</span><span id="hudGems">💎 0</span><button class="mini" id="muteBtn" title="צלילים">🔊</button></div>
</header>
<main>
  <section class="scr" id="scr-menu"></section>
  <section class="scr" id="scr-map"></section>
  <section class="scr" id="scr-play"></section>
  <section class="scr" id="scr-arcsel"></section>
  <section class="scr" id="scr-build"></section>
  <section class="scr" id="scr-cansel"></section>
  <section class="scr" id="scr-cannon"></section>
  <section class="scr" id="scr-parent"></section>
</main>
<div id="modal" class="hidden"><div class="panel" id="modalBox"></div></div>
<div id="ground"></div>

<script>
'use strict';
/* ========== helpers ========== */
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const M=s=>`<bdi dir="ltr">${s}</bdi>`;
const f1=n=>Math.round(n*10)/10;

/* ========== storage ========== */
const LEGACY='blockGeometryV1',PKEY='blockGeometryPlayers';
let KEY=null,P={list:[],cur:null};
function saveP(){try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}}
function loadP(){let o=null;try{o=JSON.parse(localStorage.getItem(PKEY)||'null')}catch(e){}
  if(o&&Array.isArray(o.list)){P=o;return}
  P={list:[],cur:null};
  try{const old=localStorage.getItem(LEGACY);if(old){const d=JSON.parse(old)||{};const id='p'+Date.now();
    localStorage.setItem(LEGACY+'_'+id,old);P.list.push({id,name:d.name||'שחקן 1'});P.cur=id;localStorage.removeItem(LEGACY)}}catch(e){}
  saveP()}
let S;
function defState(){return{stars:{},best:{},stats:{},topics:{angles:{c:0,t:0},shapes:{c:0,t:0},area:{c:0,t:0}},
  modeTime:{quest:0,arcade:0,builder:0,cannon:0},modePlays:{quest:0,arcade:0,builder:0,cannon:0},ratings:{quest:[],arcade:[],builder:[],cannon:[]},
  sessions:0,gems:0,totalTime:0,history:[],mute:false,name:''}}
function load(){const d=defState();let o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
  S=Object.assign(d,o);for(const k of ['topics','modeTime','modePlays','ratings'])S[k]=Object.assign(defState()[k],o[k]||{})}
function save(){if(!KEY)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function totalStars(){return Object.values(S.stars).reduce((a,b)=>a+b,0)}
function setStars(k,n){if((S.stars[k]||0)<n)S.stars[k]=n;save();hud()}
function hud(){$('#gameTitle').textContent='עולם הקוביות'+(S.name?' של '+S.name:'');$('#hudStars').textContent='⭐ '+totalStars();$('#hudGems').textContent='💎 '+S.gems;$('#muteBtn').textContent=S.mute?'🔇':'🔊'}
function record(type,topic,ok){const st=S.stats[type]||(S.stats[type]={c:0,t:0});st.t++;if(ok)st.c++;
  const tp=S.topics[topic];if(tp){tp.t++;if(ok)tp.c++}if(ok)S.gems++;save();hud()}
function addHistory(mode,detail,stars){const d=new Date();
  S.history.unshift({d:d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),m:mode,x:detail,s:stars});
  S.history=S.history.slice(0,40);S.modePlays[mode]=(S.modePlays[mode]||0)+1;save()}

/* ========== sound ========== */
let AC=null;
function beep(f,d=.12,type='square',v=.05,when=0){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+when;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
const SND={ok(){beep(660,.1);beep(990,.16,'square',.05,.09)},bad(){beep(180,.28,'sawtooth',.045)},
  win(){[523,659,784,1046].forEach((f,i)=>beep(f,.2,'square',.05,i*.12))},boom(){beep(110,.35,'sawtooth',.07);beep(70,.4,'square',.05,.05)},
  click(){beep(500,.05,'square',.03)},shoot(){beep(300,.12,'triangle',.07);beep(200,.15,'triangle',.05,.05)}};

/* ========== names ========== */
const TOPICS={angles:{name:'זוויות',world:'מכרה הזוויות',icon:'📐'},shapes:{name:'צורות ומשולשים',world:'יער הצורות',icon:'🔺'},area:{name:'היקף ושטח',world:'כפר הבנאים',icon:'🏠'}};
const MODES={quest:{name:'מסע הכרייה',icon:'⛏️'},arcade:{name:'מרוץ נגד השעון',icon:'⏱️'},builder:{name:'בנאי הקוביות',icon:'🧱'},cannon:{name:'תותח הזוויות',icon:'🎯'}};
const TYPES={
 ang_classify:['angles','סוגי זוויות (חדה, ישרה, קהה)',1],
 ang_estimate:['angles','הערכת גודל של זווית',1],
 ang_tri:['angles','זווית חסרה במשולש (סכום 180°)',1],
 ang_line:['angles','זוויות צמודות על קו ישר',2],
 ang_right:['angles','השלמה לזווית ישרה',2],
 ang_point:['angles','זוויות סביב נקודה / במרובע (360°)',3],
 sh_tri_sides:['shapes','סוגי משולשים לפי צלעות',1],
 sh_tri_angles:['shapes','סוגי משולשים לפי זוויות',1],
 sh_quad:['shapes','זיהוי מרובעים',1],
 sh_poly:['shapes','שמות של מצולעים',1],
 sh_truth:['shapes','תכונות של צורות (נכון / לא נכון)',2],
 sh_exist:['shapes','האם משולש כזה קיים?',3],
 ar_grid:['area','שטח והיקף על משבצות',1],
 ar_rect_p:['area','היקף מלבן',1],
 ar_rect_a:['area','שטח מלבן',1],
 ar_square:['area','שטח והיקף של ריבוע',2],
 ar_missing:['area','מציאת צלע חסרה',2],
 ar_tri:['area','שטח משולש',3],
 ar_para:['area','שטח מקבילית',3],
 build:['area','בנייה לפי שטח והיקף (בנאי)',1],
 cannon:['angles','הערכת זוויות (תותח)',1]
};

/* ========== svg helpers ========== */
const svgW=(inner,w=300,h=200)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
function pt(cx,cy,L,deg){const r=deg*Math.PI/180;return[f1(cx+L*Math.cos(r)),f1(cy-L*Math.sin(r))]}
function arc(cx,cy,r,a1,a2,cls='arc'){const p=pt(cx,cy,r,a1),q=pt(cx,cy,r,a2);return`<path class="${cls}" d="M${p} A${r} ${r} 0 ${a2-a1>180?1:0} 0 ${q}"/>`}
function lbl(x,y,t,q){return`<text class="lbl${q?' q':''}" x="${f1(x)}" y="${f1(y+6)}">${t}</text>`}
function rightMark(cx,cy,a,s=16){const p=pt(cx,cy,s,a),q=pt(cx,cy,s,a+90);const c=[f1(p[0]+q[0]-cx),f1(p[1]+q[1]-cy)];return`<path d="M${p} L${c} L${q}" fill="none" stroke="#e94f37" stroke-width="3"/>`}
function angleFig(deg,rot=0,noMark=false){
  const flat=rot===0;const cx=150,cy=flat?165:100,L=flat?125:85;
  const p=pt(cx,cy,L,rot),q=pt(cx,cy,L,rot+deg);
  let s=`<line class="ray" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/><line class="ray" x1="${cx}" y1="${cy}" x2="${q[0]}" y2="${q[1]}"/>`;
  s+=(deg===90&&!noMark)?rightMark(cx,cy,rot,20):arc(cx,cy,30,rot,rot+deg);
  s+=`<circle cx="${cx}" cy="${cy}" r="5" fill="#2b1d0e"/>`;return svgW(s)}
function triPts(a,b){const r=Math.PI/180,c=180-a-b;const AC=Math.sin(b*r)/Math.sin(c*r);const P=[[0,0],[1,0],[AC*Math.cos(a*r),AC*Math.sin(a*r)]];
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);const mnx=Math.min(...xs),mxx=Math.max(...xs),mxy=Math.max(...ys);
  const sc=Math.min(210/(mxx-mnx),135/mxy);const off=(210-(mxx-mnx)*sc)/2;
  return P.map(p=>[f1(45+(p[0]-mnx)*sc+off),f1(172-p[1]*sc)])}
function triFig(P,labels,sides,extra=''){
  const cen=[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
  let s=`<polygon class="shp" points="${P.map(p=>p.join(',')).join(' ')}"/>`;
  if(labels)P.forEach((p,i)=>{if(!labels[i])return;const a=P[(i+1)%3],b=P[(i+2)%3];const u=[a[0]-p[0],a[1]-p[1]],v=[b[0]-p[0],b[1]-p[1]];const lu=Math.hypot(...u),lv=Math.hypot(...v);
    const bx=u[0]/lu+v[0]/lv,by=u[1]/lu+v[1]/lv,bl=Math.hypot(bx,by)||1;const ang=Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/(lu*lv))));
    const k=Math.max(28,Math.min(62,Math.min(lu,lv)*.45,24/Math.sin(ang/2)));s+=lbl(p[0]+bx/bl*k,p[1]+by/bl*k,labels[i],labels[i]==='?')});
  if(sides)for(let i=0;i<3;i++){if(sides[i]==null)continue;const p=P[i],q=P[(i+1)%3];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;const dx=mx-cen[0],dy=my-cen[1],L=Math.hypot(dx,dy)||1;s+=lbl(mx+dx/L*17,my+dy/L*17,sides[i],sides[i]==='?')}
  return svgW(s+extra)}
function tick(p,q,n){const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);const ux=dx/L,uy=dy/L,nx=-uy,ny=ux;let s='';
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*7;const cx=mx+ux*o,cy=my+uy*o;s+=`<line class="tick" x1="${f1(cx-nx*8)}" y1="${f1(cy-ny*8)}" x2="${f1(cx+nx*8)}" y2="${f1(cy+ny*8)}"/>`}return s}
function polyFig(P,extra=''){return svgW(`<polygon class="shp" points="${P.map(p=>p.join(',')).join(' ')}"/>`+extra)}
function rectFig(w,h,lw,lh){const sc=Math.min(200/w,120/h);const W=w*sc,H=h*sc,x=(300-W)/2,y=(175-H)/2+2;
  return svgW(`<rect class="shp" x="${f1(x)}" y="${f1(y)}" width="${f1(W)}" height="${f1(H)}"/>`+rightMark(x,y+H,0,12)+lbl(150,y+H+18,lw,lw==='?')+lbl(x-20,y+H/2,lh,lh==='?'))}

/* ========== question generators ========== */
function numOpts(c,extras,unit=''){const set=[c];
  for(const e of shuffle(extras)){if(set.length>=4)break;if(e>0&&Number.isInteger(e)&&!set.includes(e))set.push(e)}
  let k=1;while(set.length<4){const st=c>=40?5:c>=12?2:1;for(const v of shuffle([c+k*st,c-k*st]))if(set.length<4&&v>0&&!set.includes(v))set.push(v);k++}
  const arr=shuffle(set);return{opts:arr.map(v=>unit==='°'?M(v+'°'):unit?M(v)+unit:M(v)),ans:arr.indexOf(c)}}
const fixDeg=s=>String(s).replace(/(\d+°)/g,'<bdi dir="ltr">$1</bdi>');
function txtOpts(correct,wrongs){const arr=shuffle([correct,...wrongs]);return{opts:arr,ans:arr.indexOf(correct)}}
const POLY=['משולש','מרובע','מחומש','משושה','משובע','מתומן'];

function polyomino(n,W=7,H=5){const set=new Set(['3,2']);let guard=0;while(set.size<n&&guard++<500){const[x,y]=pick([...set]).split(',').map(Number);const[dx,dy]=pick([[1,0],[-1,0],[0,1],[0,-1]]);const nx=x+dx,ny=y+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H)set.add(nx+','+ny)}return[...set].map(s=>s.split(',').map(Number))}
function perimOf(cells){const set=new Set(cells.map(c=>c.join(',')));let p=0;for(const[x,y]of cells)for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(!set.has((x+dx)+','+(y+dy)))p++;return p}

let lastType='';
function gen(topic,d){const cands=Object.keys(G).filter(k=>TYPES[k][0]===topic&&TYPES[k][2]<=d&&k!==lastType);

  const t=pick(w);lastType=t;const q=G[t](d);q.type=t;q.topic=topic;return q}

let Q={};
function startQuest(topic,lvl){Q={kind:'quest',topic,lvl,i:0,ok:0,n:5,diff:[1,1,2,2,3,3][lvl],res:[]};
  $('#scr-play').innerHTML=`<div class="panel"><div class="phead"><div class="big">${TOPICS[topic].icon} ${TOPICS[topic].world} · שלב ${lvl+1}</div><div class="blocks" id="blocks"></div></div>

   <div class="center"><button class="btn stone" id="quitBtn">↩ חזרה למפה</button></div>`;
  $('#quitBtn').onclick=questMap;show('play');nextQ()}
function drawBlocks(){let h='';for(let i=0;i<Q.n;i++){const r=Q.res[i];h+=`<div class="blk ${r===true?'ore':r===false?'crk':''} ${i===Q.i&&r===undefined?'cur':''}">${r===true?'💎':r===false?'✖':''}</div>`}$('#blocks').innerHTML=h}
function nextQ(){if(Q.kind==='quest'){if(Q.i>=Q.n)return finishQuest();drawBlocks()}
  const topic=Q.topic==='mix'?pick(['angles','shapes','area']):Q.topic;const d=Q.kind==='arcade'?(Q.correct<4?1:Q.correct<9?2:3):Q.diff;
  const q=gen(topic,d);Q.cur=q;Q.locked=false;
  $('#qtext').innerHTML=fixDeg(q.text);$('#qfig').innerHTML=q.svg||'';$('#qfb').innerHTML='';
  $('#qopts').innerHTML=q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${fixDeg(o)}</button>`).join('');
  $('#qopts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
function answer(i){if(Q.locked)return;Q.locked=true;const q=Q.cur,ok=i===q.ans;record(q.type,q.topic,ok);
  const bs=$('#qopts').querySelectorAll('.opt');bs.forEach(b=>b.disabled=true);bs[q.ans].classList.add('right');if(!ok)bs[i].classList.add('wrong');
  if(Q.kind==='quest'){Q.res[Q.i]=ok;if(ok)Q.ok++;drawBlocks();
    if(ok){SND.ok();$('#qfb').innerHTML=`<div class="good">${pick(['✔ כל הכבוד!','✔ מצוין!','✔ נכון מאוד!','✔ אלוף!','✔ יפה מאוד!'])} 💎</div>`;setTimeout(()=>{Q.i++;nextQ()},900)}
    else{SND.bad();$('#qfb').innerHTML=`<div class="bad"><b>✘ לא בדיוק.</b> ${fixDeg(q.exp)}<div style="margin-top:10px"><button class="btn" id="contBtn">הבנתי, ממשיכים ←</button></div></div>`;$('#contBtn').onclick=()=>{Q.i++;nextQ()}}}
  else arcadeAnswer(ok,q)}
function finishQuest(){const st=Q.ok===5?3:Q.ok===4?2:Q.ok===3?1:0;const k=`q-${Q.topic}-${Q.lvl}`;if(st)setStars(k,st);
  addHistory('quest',`${TOPICS[Q.topic].world} שלב ${Q.lvl+1}: ${Q.ok}/5`,st);if(st)SND.win();else SND.bad();
  results({title:st?'השלב הושלם!':'כמעט! נסו שוב',stars:st,line:`ענית נכון על ${Q.ok} מתוך 5 שאלות.${st?'':' צריך לפחות 3 כדי לעבור.'}`,
   again:()=>startQuest(Q.topic,Q.lvl),back:questMap,next:st&&Q.lvl<5?()=>startQuest(Q.topic,Q.lvl+1):null,mode:'quest'})}

function arcadeSel(){setMode('arcade');clearTimers();

function startArcade(topic){clearTimers();Q={kind:'arcade',topic,score:0,combo:1,correct:0,wrong:0,time:60};
  $('#scr-play').innerHTML=`<div class="panel"><div class="phead"><div class="big">⏱️ <span id="tleft">60</span></div><div class="timer"><i id="tbar" style="width:100%"></i></div>
   <div class="big">🏆 <span id="score">0</span> <span id="combo" style="color:#c9473a"></span></div></div>
   <div class="qtext" id="qtext"></div><div id="qfig"></div><div class="opts" id="qopts"></div><div class="fb" id="qfb"></div></div>
   <div class="center"><button class="btn stone" id="quitBtn">↩ יציאה</button></div>`;
  $('#quitBtn').onclick=()=>{clearTimers();arcadeSel()};show('play');nextQ();
  timers.push(setInterval(()=>{Q.time-=.25;updTimer();if(Q.time<=0){clearTimers();finishArcade()}},250))}
function updTimer(){const t=Math.max(0,Q.time);$('#tleft').textContent=Math.ceil(t);$('#tbar').style.width=(t/60*100)+'%';$('#tbar').style.background=t<10?'#c9473a':'#e3b22b'}
function arcadeAnswer(ok,q){if(ok){SND.ok();Q.correct++;Q.score+=10*Q.combo;Q.combo=Math.min(Q.combo+1,5);$('#qfb').innerHTML=`<div class="good">+${10*(Q.combo>1?Q.combo-1:1)}</div>`;timers.push(setTimeout(nextQ,350))}
  else{SND.bad();Q.wrong++;Q.combo=1;Q.time-=3;updTimer();$('#qfb').innerHTML=`<div class="bad" style="padding:6px 10px">−3 שניות. ${fixDeg(q.exp)}</div>`;timers.push(setTimeout(nextQ,2200))}
  $('#score').textContent=Q.score;$('#combo').textContent=Q.combo>1?'×'+Q.combo:''}
function finishArcade(){Q.locked=true;const st=Q.correct>=14?3:Q.correct>=10?2:Q.correct>=6?1:0;if(st)setStars('a-'+Q.topic,st);
  const rec=Q.score>(S.best[Q.topic]||0);if(rec){S.best[Q.topic]=Q.score;save()}SND.win();
  const tn=Q.topic==='mix'?'הכל ביחד':TOPICS[Q.topic].name;addHistory('arcade',`${tn}: ${Q.correct} נכונות, ${Q.wrong} טעויות, ${Q.score} נק'`,st);
  results({title:rec?'🏆 שיא חדש!':'הזמן נגמר!',stars:st,line:`${Q.score} נקודות · ${Q.correct} תשובות נכונות · ${Q.wrong} טעויות`,again:()=>startArcade(Q.topic),back:arcadeSel,mode:'arcade'})}

function hintOf(m){if(m.square&&m.area)return`בריבוע האורך שווה לרוחב. איזה מספר כפול עצמו נותן ${m.area}?`;

  if(m.rect&&m.area&&m.perim)return`חפשו אורך ורוחב שהכפל שלהם הוא ${m.area} והסכום שלהם הוא ${m.perim/2} (חצי מההיקף).`;

   <div class="row" style="font-size:18px;gap:18px"><span>⏳ זמן משחק כולל: <b>${mins(S.totalTime)}</b></span><span>📅 כניסות: <b>${S.sessions}</b></span><span>⭐ כוכבים: <b>${totalStars()}</b> / 120</span><span>💎 יהלומים: <b>${S.gems}</b></span></div></div>
   <div class="panel"><h3>לפי נושא</h3><table class="t"><tr><th>נושא</th><th>שאלות</th><th>הצלחה</th><th></th></tr>${tp}</table></div>
   <div class="panel"><h3>⚠️ כדאי לחזק</h3>${weak.length?weak.map(x=>`<span class="tag">${TYPES[x.k][1]} – ${Math.round(x.a*100)}% (${x.o.t})</span>`).join(''):'<span class="muted">אין עדיין נקודות חלשות ברורות (צריך לפחות 3 ניסיונות בכל סוג שאלה).</span>'}
   <h3 style="margin-top:12px">💪 חזק ב־</h3>${strong.length?strong.map(x=>`<span class="tag" style="background:#e3f7d6;border-color:#3d7a22">${TYPES[x.k][1]} – ${Math.round(x.a*100)}%</span>`).join(''):'<span class="muted">עוד אין מספיק נתונים.</span>'}</div>
   <div class="panel"><h3>🎮 איזה סוג משחק הוא אוהב?</h3><table class="t"><tr><th>משחק</th><th>זמן</th><th>משחקים</th><th>דירוג שלו</th></tr>${md}</table>
   <div class="muted" style="margin-top:6px">${S.totalTime>120?`עד עכשיו הכי הרבה זמן ב: <b>${MODES[fav].name}</b>. `:''}"דירוג שלו" = מה שהשחקן בחר בסוף כל משחק (😀/😐/🙁).</div></div>
   <div class="panel"><h3>🕑 משחקים אחרונים</h3><table class="t"><tr><th>מתי</th><th>מה</th><th>כוכבים</th></tr>${hist}</table></div>
   <div class="row" style="justify-content:center"><button class="btn" id="pBack">↩ חזרה למשחק</button><button class="btn wood" id="pName">✏️ שינוי שם השחקן</button><button class="btn red" id="pReset">🗑 איפוס כל ההתקדמות</button><button class="btn red" id="pDel">❌ מחיקת שחקן</button></div>`;
  $('#pBack').onclick=menu;$('#pName').onclick=()=>askName(false);$('#pDel').onclick=()=>{modal(`<h2>למחוק את ${esc(S.name||'השחקן')}?</h2><div>השחקן וכל ההתקדמות שלו יימחקו מהמחשב הזה.</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn red" id="dlY">כן, למחוק</button><button class="btn stone" id="dlN">ביטול</button></div>`);
    $('#dlY').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}P.list=P.list.filter(p=>p.id!==P.cur);P.cur=null;KEY=null;saveP();S=defState();hud();menu();whoPlays()};$('#dlN').onclick=closeModal};$('#pReset').onclick=()=>{modal(`<h2>לאפס הכל?</h2><div>כל הכוכבים, השיאים והנתונים יימחקו.</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn red" id="rsY">כן, לאפס</button><button class="btn stone" id="rsN">ביטול</button></div>`);
    $('#rsY').onclick=()=>{const m=S.mute,nm=S.name;S=defState();S.mute=m;S.name=nm;S.sessions=1;save();hud();closeModal();parent()};$('#rsN').onclick=closeModal};show('parent')}

/* ---------- session timer & break ---------- */
let sessSec=0,breakAt=15*60;
setInterval(()=>{if(document.hidden||!curMode)return;S.modeTime[curMode]=(S.modeTime[curMode]||0)+1;S.totalTime++;sessSec++;if(sessSec%10===0)save();
  if(sessSec>=breakAt&&$('#modal').classList.contains('hidden')){breakAt=sessSec+5*60;
    modal(`<h2>🕒 עבודה מצוינת!</h2><div style="font-size:19px">שיחקת כבר ${Math.round(sessSec/60)} דקות ואספת ${totalStars()} כוכבים בסך הכל.<br>זה זמן טוב להפסקה – לשתות מים ולזוז קצת 🙂</div>
     <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="brStop">סיימתי להיום 👋</button><button class="btn stone" id="brMore">עוד 5 דקות</button></div>`);
    $('#brStop').onclick=()=>{closeModal();clearTimers();menu()};$('#brMore').onclick=closeModal}},1000);

/* ---------- init ---------- */
loadP();S=defState();
$('#homeBtn').onclick=()=>{closeModal();menu()};
$('#whoBtn').onclick=()=>{clearTimers();menu();whoPlays()};
$('#muteBtn').onclick=()=>{S.mute=!S.mute;save();hud()};
if(P.cur&&curP())startPlayer(P.cur);else{hud();menu();whoPlays()}
</script>
</body>
</html>
